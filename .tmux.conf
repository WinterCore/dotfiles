# Splits (matching your vim)
bind g split-window -h -c "#{pane_current_path}"   # Space+g: horizontal split (side-by-side)
                                                    # -h = horizontal split
                                                    # -c = start in current directory
bind G split-window -v -c "#{pane_current_path}"   # Space+G: vertical split (top/bottom)



# Window (tab) management
bind c new-window -c "#{pane_current_path}"         # Space+c: new window (tab)
bind x kill-window                                  # Space+x: close current window
bind n next-window                                  # Space+n: next window
bind p previous-window                              # Space+p: previous window
bind - choose-tree -Zw                              # Space+-: show window picker
                                                    # -Z = zoom the picker
                                                    # w = windows only (not sessions)


# Optional: number windows from 1 (more natural)
set -g base-index 1              # Start window numbering at 1 instead of 0
setw -g pane-base-index 1        # Start pane numbering at 1 instead of 0

# Renumber windows when one is closed
set -g renumber-windows on       # Auto-renumber windows so no gaps (1,2,3 not 1,3,5)


set-window-option -g mode-keys vi

bind s copy-mode

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
