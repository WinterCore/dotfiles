$mainMod = SUPER

exec-once = wluma
exec-once = hyprpaper
exec-once = wl-paste --watch cliphist store
exec-once = waybar

monitor = eDP-1, 2880x1800@120.00Hz, 2560x0, 1.5
monitor = HDMI-A-1, 2560x1440@144.00Hz, 0x0, 1

# unscale XWayland
xwayland {
  force_zero_scaling = false
}

#gestures {
#    workspace_swipe = true
#    workspace_swipe_touch = true
#}

input {
    kb_layout = us
    kb_layout = us,ara
    kb_variant = ,qwerty
    kb_options = grp:alt_shift_toggle

    follow_mouse = 1

    sensitivity = -0.1 # -1.0 - 1.0, 0 means no modification.
    
    repeat_delay = 300
    repeat_rate = 40

    touchpad {
        natural_scroll = true
    }
}

device {
    name = logitech-g305-1
    sensitivity = 0
    accel_profile = flat
}

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master
}

master {
    smart_resizing = false
}


decoration {
    rounding = 0
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 3, default
    animation = border, 1, 3, easeOutQuint
    animation = windows, 1, 3, easeOutQuint
    animation = windowsIn, 1, 3, easeOutQuint, popin 87%
    animation = windowsOut, 1, 2, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 2, quick
    animation = layers, 1, 3, easeOutQuint
    animation = layersIn, 1, 3, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

bind = $mainMod SHIFT, E, exec, uwsm stop
bind = $mainMod, W, exec, firefox
bind = $mainMod, E, exec, thunar
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, Z, exec, hyprshot -m region --raw - | swappy -f -
bind = $mainMod, C, exec, cliphist list | wofi -S dmenu | cliphist decode | wl-copy

bind = $mainMod SHIFT, X, exec, hyprlock
bind = $mainMod, F, fullscreen


# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bind = $mainMod, Q, killactive, # Close

bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod SHIFT, D, exec, wofi --show run

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume
bind = $mainMod, bracketright, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = $mainMod, bracketleft, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Media
bind = $mainMod CTRL, k, exec, playerctl play-pause
bind = $mainMod CTRL, l, exec, playerctl next
bind = $mainMod CTRL, j, exec, playerctl previous

bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=, XF86AudioPlay, exec, playerctl play-pause
bindl=, XF86AudioNext, exec, playerctl next 
bindl=, XF86AudioPrev, exec, playerctl previous

# MPD
bind = $mainMod CTRL SHIFT, k, exec, mpc toggle
bind = $mainMod CTRL SHIFT, l, exec, mpc next
bind = $mainMod CTRL SHIFT, j, exec, mpc prev


# Disable internal monitor
bind = $mainMod CTRL, slash, exec, hyprctl keyword monitor "eDP-1, disable"
bind = $mainMod CTRL, period, exec, hyprctl keyword monitor "eDP-1, enable"


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

binde = $mainMod CTRL, l, resizeactive, 30 0
binde = $mainMod CTRL, h, resizeactive, -30 0
binde = $mainMod CTRL, k, resizeactive, 0 -20
binde = $mainMod CTRL, j, resizeactive, 0 20


# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = Super+Shift, h, movewindow, l # [hidden]
bind = Super+Shift, l, movewindow, r # [hidden]
bind = Super+Shift, k, movewindow, u # [hidden]
bind = Super+Shift, j, movewindow, d # [hidden]

bind = $mainMod, space, togglefloating,
bind = $mainMod SHIFT, comma, exec, hyprctl keyword monitor "eDP-1, disable"
bind = $mainMod SHIFT, period, exec, hyprctl keyword monitor "eDP-1, enable"


misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
